<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>말랑 펫</title>
<link rel="icon" href="data/icon.png">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#3a2f35;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* 크기는 view.js 가 innerWidth/innerHeight 로 직접 정한다(모바일 100vh 는 주소창이 숨었을 때 높이라 실제 화면보다 길다) */
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
button{touch-action:manipulation}
/* 오른쪽 위 작은 발바닥 버튼 — 누르면 메뉴가 아래로 펼쳐진다 */
#menuBtn{position:fixed;right:8px;top:8px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,250,244,.55);box-shadow:0 1px 6px rgba(60,40,30,.22);cursor:pointer;padding:0;opacity:.6;transition:opacity .2s,background .2s}
#menuBtn:hover,body.ui #menuBtn{opacity:1;background:rgba(255,250,244,.95)}
#menuBtn:focus-visible{outline:2px solid #6f9f87;outline-offset:1px}
#bar{position:fixed;right:8px;top:46px;display:grid;grid-template-columns:repeat(1,34px);gap:2px;padding:4px;border-radius:14px;background:rgba(255,250,244,.92);box-shadow:0 2px 10px rgba(60,40,30,.25);opacity:0;transform:translateY(-6px);transition:opacity .18s,transform .18s;pointer-events:none}
@media (max-height:460px){#bar{grid-template-columns:repeat(2,34px)}}
@media (max-height:270px){#bar{grid-template-columns:repeat(3,34px)}}
body.ui #bar{opacity:1;transform:none;pointer-events:auto}
#bar button{width:34px;height:34px;border:0;border-radius:10px;background:transparent;cursor:pointer;padding:0;position:relative}
#bar button:hover{background:rgba(255,255,255,.95)}
#bar button[aria-pressed=true]{background:#ffe2c6;box-shadow:inset 0 0 0 2px #efae84}
#bar button:focus-visible{outline:2px solid #6f9f87;outline-offset:1px}
#bar button[data-mode=auto]::after{content:'';position:absolute;right:4px;bottom:4px;width:6px;height:6px;border-radius:50%;background:#8fb89f}
#hint{position:fixed;left:50%;top:8px;transform:translateX(-50%);max-width:88vw;font:12px/1.45 system-ui,'Malgun Gothic',sans-serif;color:#5b4b40;background:rgba(255,250,244,.9);padding:5px 11px;border-radius:10px;opacity:0;transition:opacity .6s;pointer-events:none;text-align:center}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="menuBtn" type="button" title="메뉴" aria-label="메뉴" aria-expanded="false"></button>
<div id="bar" role="toolbar" aria-label="놀아 주기"></div>
<div id="hint" role="status"></div>
<script src="js/config.js"></script>
<script src="js/tuning.js"></script>
<script src="js/audio.js"></script>
<script src="js/sim.js"></script>
<script src="js/behaviors.js"></script>
<script src="js/view.js"></script>
</body>
</html>
